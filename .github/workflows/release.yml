name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Windows Release
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Release tag '$env:RELEASE_TAG' does not match package version '$version'. Expected '$expectedTag'."
          }

      - name: Run release checks
        run: |
          npm run format:check
          npm run test:static

      - name: Build Squirrel installer
        run: npm run desktop:package

      - name: Verify artifacts and create checksums
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $requiredArtifacts = @(
            "Deadlands-Character-Tracker-$version-Setup.exe",
            "DeadlandsCharacterTracker-$version-full.nupkg",
            "RELEASES"
          )

          foreach ($artifact in $requiredArtifacts) {
            if (-not (Test-Path -LiteralPath (Join-Path release $artifact))) {
              throw "Required release artifact is missing: $artifact"
            }
          }

          Get-ChildItem -LiteralPath release -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
              "{0} *{1}" -f $hash.Hash, $_.Name
            } |
            Set-Content -LiteralPath release\SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $artifacts = Get-ChildItem -LiteralPath release -File |
            Sort-Object Name |
            ForEach-Object { $_.FullName }

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @artifacts --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:RELEASE_TAG @artifacts `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --generate-notes `
              --title "Deadlands Character Tracker $version"
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publishing failed."
          }
