appId: com.studiosam.deadlands-character-tracker
productName: Deadlands Character Tracker
asar: true

directories:
  output: release
  buildResources: electron/build-resources

files:
  - index.html
  - styles.css
  - assets/**/*
  - favicon/**/*
  - docs/**/*
  - electron/main.cjs
  - src/**/*
  - README.md
  - NOTICE.md
  - PRIVACY.md
  - LICENSE
  - package.json

win:
  icon: assets/studiosam.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Deadlands-Character-Tracker-${version}-Setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Deadlands Character Tracker
  installerSidebar: electron/build-resources/installerSidebar.bmp
  uninstallerSidebar: electron/build-resources/installerSidebar.bmp
  license: LICENSE
